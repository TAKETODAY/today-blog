openapi: 3.0.3

info:
  title: TODAY BLOG API
  description: |
    TODAY BLOG（TODAY 博客系统）的 HTTP API 规范。

    ## 鉴权

    - **公开接口**（`/api/*`）：无需登录即可访问。
    - **用户接口**（`/api/auth` 中部分接口）：需要处于登录状态，
      浏览器会话通过 `SESSION` Cookie 自动携带。
    - **管理后台接口**（`/api/console/*`、`/api/statistics/*`）：需要博主权限，
      支持以下两种方式之一：
      1. 会话鉴权：浏览器登录会话（`SESSION` Cookie），需为博主账号；
      2. API Key 鉴权：请求头 `Authorization: <api-key>` 或 `X-API-Key: <api-key>`。
  version: "3.3-SNAPSHOT"
  contact:
    name: TAKETODAY
    url: https://taketoday.cn

servers:
  - url: http://localhost:8080
    description: 本地开发环境（端口 8080）
  - url: https://api.example.com
    description: 生产环境（占位，请按实际部署地址替换）

tags:
  - name: 文章
    description: 公开文章查询接口
  - name: 认证
    description: 登录、登出与当前用户信息维护
  - name: 分类
    description: 公开分类查询接口
  - name: 评论
    description: 公开评论接口
  - name: 标签
    description: 公开标签查询接口
  - name: 站点选项
    description: 公开的站点配置选项
  - name: 页面访问
    description: 页面浏览量（PV）记录
  - name: 后台-文章
    description: 管理后台文章管理接口（需博主权限）
  - name: 后台-API Key
    description: 博主 API Key 管理接口（需博主权限）
  - name: 后台-附件
    description: 附件上传与管理接口（需博主权限）
  - name: 后台-分类
    description: 管理后台分类管理接口（需博主权限）
  - name: 后台-评论
    description: 管理后台评论管理接口（需博主权限）
  - name: 后台-标签
    description: 管理后台标签管理接口（需博主权限）
  - name: 后台-日志
    description: 操作日志查询与删除接口（需博主权限）
  - name: 后台-邮件
    description: 邮件队列管理接口（需博主权限）
  - name: 后台-选项
    description: 管理后台选项（配置项）管理接口（需博主权限）
  - name: 后台-页面访问
    description: 页面访问记录查询接口（需博主权限）
  - name: 后台-用户
    description: 管理后台用户管理接口（需博主权限）
  - name: 统计
    description: 博客统计接口（需博主权限）

paths:
  # ============================== 公开 API ==============================
  # ----------------------------- 文章相关 ------------------------------
  /api/articles:
    get:
      tags:
        - 文章
      summary: 文章列表 / 搜索 / 分类 / 标签 / 最受欢迎
      description: |
        本路径根据不同的查询参数组合提供多种查询能力：

        - 无参数（或携带分页参数）：获取主页文章列表（分页）；
        - `q`：全文搜索；
        - `category`：按分类获取文章；
        - `tag`：按标签获取文章；
        - `most-popular`：获取最受欢迎的文章列表（不参与分页 data 形式）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          required: false
          description: 搜索关键字（当提供本参数时执行搜索）
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: 文章分类名（当提供本参数时按分类查询）
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: 文章标签名（当提供本参数时按标签查询）
          schema:
            type: string
        - name: most-popular
          in: query
          required: false
          description: 固定标志参数，用于区分"最受欢迎"接口，值任意（可为空）
          schema:
            type: string
      responses:
        '200':
          description: 查询成功。`most-popular` 模式返回 `ArticleItem[]`，其余模式返回分页结构
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ArticleItemPage'
                  - type: array
                    items:
                      $ref: '#/components/schemas/ArticleItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/articles/{id}/pv:
    patch:
      tags:
        - 文章
      summary: 更新文章浏览量
      description: |
        增加文章 PV 计数。仅当请求不携带已登录博主会话时执行计数；
        若带验证码频率限制（`RequestLimit(count = 2)`）。
      parameters:
        - name: id
          in: path
          required: true
          description: 文章 ID
          schema:
            type: integer
            format: int64
        - name: Referer
          in: header
          required: true
          description: 来源页面地址
          schema:
            type: string
      responses:
        '200':
          description: 更新成功
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/articles/{id}/tags:
    get:
      tags:
        - 文章
      summary: 获取文章标签
      parameters:
        - name: id
          in: path
          required: true
          description: 文章 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 文章标签名集合
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/articles/{uri}:
    get:
      tags:
        - 文章
      summary: 获取文章详情
      description: |
        根据文章 URI（或数字 ID）获取文章详情。

        - 默认返回 `application/json` 的 `Article` 结构；
        - 请求头 `Accept: text/markdown` 时返回文章的 Markdown 原文（`string`）。

        若文章设置了访问密码，需要通过 `key` 查询参数传入密码。
      parameters:
        - name: uri
          in: path
          required: true
          description: 文章访问地址（URI），也兼容数字文章 ID
          schema:
            type: string
        - name: key
          in: query
          required: false
          description: 文章访问密码（若文章设置了密码）
          schema:
            type: string
      responses:
        '200':
          description: 成功。JSON 模式下为文章详情，Markdown 模式下为原文文本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
            text/markdown:
              schema:
                type: string
                description: 文章 Markdown 原文
        '403':
          description: 文章未发布或访问密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------- 认证相关 ------------------------------
  /api/auth:
    get:
      tags:
        - 认证
      summary: 获取当前登录用户信息
      description: 获取当前登录用户信息。需要处于登录状态（浏览器请求自动携带 `SESSION` Cookie）。
      security:
        - AuthenticationInfo: []
      responses:
        '200':
          description: 当前登录用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - 认证
      summary: 退出登录
      description: 使当前会话失效。需要登录用户会话。
      security:
        - AuthenticationInfo: []
      responses:
        '200':
          description: 登出成功
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - 认证
      summary: 用户登录
      description: |
        通过邮箱 + 密码登录。登录成功后返回用户信息并建立会话。
        频率限制：1 分钟内最多尝试 5 次。
      parameters:
        - name: v2
          in: query
          required: true
          description: 固定标志参数，标识当前登录 API 版本，值为 `v2`
          schema:
            type: string
            const: v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFrom'
      responses:
        '200':
          description: 登录成功，返回用户信息（博主账号还会绑定博主身份）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: 登录尝试过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - 认证
      summary: 更新当前登录用户信息
      description: |
        更新当前登录用户信息。根据携带的查询参数区分执行的操作：

        - 不带区分参数：更新资料（昵称、站点、介绍、邮件通知），请求体为 `InfoForm`；
        - `password`：修改密码，请求体为 `ChangePasswordForm`，成功返回 204；
        - `email-mobile-phone`：修改邮箱，请求体为 `UserEmailForm`，返回更新后的用户；
        - `avatar`：更换头像，`multipart/form-data` 字段 `avatar`，返回更新后的用户；
        - `background`：更换背景，`multipart/form-data` 字段 `background`，返回更新后的用户。

        上述操作均需要登录用户会话。
      security:
        - AuthenticationInfo: []
      parameters:
        - name: password
          in: query
          required: false
          description: 存在该参数时表示修改密码
          schema:
            type: string
        - name: email-mobile-phone
          in: query
          required: false
          description: 存在该参数时表示修改邮箱
          schema:
            type: string
        - name: avatar
          in: query
          required: false
          description: 存在该参数时表示更换头像（multipart/form-data，字段 `avatar`）
          schema:
            type: string
        - name: background
          in: query
          required: false
          description: 存在该参数时表示更换背景（multipart/form-data，字段 `background`）
          schema:
            type: string
      requestBody:
        description: |
          请求体取决于所执行的操作（见描述）：

          - 更新资料：`InfoForm`
          - 修改密码：`ChangePasswordForm`
          - 修改邮箱：`UserEmailForm`
          - 更换头像 / 背景：`multipart/form-data`，字段分别为 `avatar` / `background`
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/InfoForm'
                - $ref: '#/components/schemas/ChangePasswordForm'
                - $ref: '#/components/schemas/UserEmailForm'
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: 头像图片文件（`?avatar` 模式）
                background:
                  type: string
                  format: binary
                  description: 背景图片文件（`?background` 模式）
      responses:
        '200':
          description: 更新资料 / 邮箱 / 头像 / 背景成功，返回更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '204':
          description: 修改密码成功（无内容）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ----------------------------- 分类相关 ------------------------------
  /api/categories:
    get:
      tags:
        - 分类
      summary: 获取全部分类
      responses:
        '200':
          description: 分类列表（按 `order` 排序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories/{name}:
    get:
      tags:
        - 分类
      summary: 按名称获取分类
      parameters:
        - name: name
          in: path
          required: true
          description: 分类名
          schema:
            type: string
      responses:
        '200':
          description: 分类信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------- 评论相关 ------------------------------
  /api/comments:
    post:
      tags:
        - 评论
      summary: 发表评论
      description: |
        提交评论。创建成功返回 201。频率限制：10 秒内只能评论一次。
        若博主已登录，评论直接通过审核；否则根据站点配置决定是否进入待审核状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentFrom'
      responses:
        '201':
          description: 评论创建成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: 评论过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - 评论
      summary: 获取文章评论列表
      parameters:
        - name: articleId
          in: query
          required: true
          description: 文章 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 文章评论列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentItem'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------- 标签相关 ------------------------------
  /api/tags:
    get:
      tags:
        - 标签
      summary: 获取全部标签
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Label'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tags/{name}:
    get:
      tags:
        - 标签
      summary: 按名称获取标签
      parameters:
        - name: name
          in: path
          required: true
          description: 标签名
          schema:
            type: string
      responses:
        '200':
          description: 标签信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------- 站点选项 ------------------------------
  /api/options:
    get:
      tags:
        - 站点选项
      summary: 获取公开的站点选项
      responses:
        '200':
          description: 公开选项键值对（key=选项名，value=选项值）
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ----------------------------- 页面访问 ------------------------------
  /api/pv:
    post:
      tags:
        - 页面访问
      summary: 记录页面访问（PV）
      description: |
        记录一次页面访问，用于站内浏览统计。
        访问来源 URL 从请求头 `Referer` 中读取；`referer` 查询参数为可选的外链来源。
        若请求来自已登录博客主，则不记录。
      parameters:
        - name: referer
          in: query
          required: false
          description: 可选的外部来源地址
          schema:
            type: string
      responses:
        '200':
          description: 记录成功
        '429':
          description: 请求过于频繁（5 次/周期）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================== 管理后台 API ==============================
  # ----------------------------- 后台-文章 ------------------------------
  /api/console/articles:
    get:
      tags:
        - 后台-文章
      summary: 条件分页查询文章列表
      description: 支持关键字、标题、内容、分类、状态与时间范围等条件筛选。
      security:
        - BloggerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: 关键字（匹配标题或内容）
          schema:
            type: string
        - name: title
          in: query
          required: false
          description: 文章标题（模糊匹配）
          schema:
            type: string
        - name: content
          in: query
          required: false
          description: 文章内容（模糊匹配）
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: 文章分类
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 文章状态
          schema:
            $ref: '#/components/schemas/PostStatus'
        - name: sort
          in: query
          required: false
          description: 排序字段与方向，如 `sort[createAt]=descend`
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/OrderBy'
        - name: createAt
          in: query
          required: false
          description: 创建时间范围（两个值构成闭区间），格式 `yyyy-MM-dd HH:mm:ss`
          schema:
            type: array
            items:
              type: string
              format: date-time
        - name: updateAt
          in: query
          required: false
          description: 更新时间范围（两个值构成闭区间），格式 `yyyy-MM-dd HH:mm:ss`
          schema:
            type: array
            items:
              type: string
              format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 文章分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - 后台-文章
      summary: 创建文章
      description: 创建成功返回 201，无响应体。
      security:
        - BloggerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleForm'
      responses:
        '201':
          description: 创建成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/console/articles/{id}:
    put:
      tags:
        - 后台-文章
      summary: 更新文章
      description: |
        更新文章内容。若查询参数携带 `status`，则为"更新文章状态"接口（仅接收
        `status` 参数，须传入 `PostStatus` 枚举值），否则为完整更新文章。
      security:
        - BloggerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 文章 ID
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: 当提供本参数时执行"更新文章状态"，值为 `PostStatus` 枚举
          schema:
            $ref: '#/components/schemas/PostStatus'
      requestBody:
        description: 文章表单（完整更新时必填；仅更新状态时可省略）
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleForm'
      responses:
        '204':
          description: 更新成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - 后台-文章
      summary: 删除文章
      security:
        - BloggerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 文章 ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------- 后台-API Key ------------------------------
  /api/console/api-keys:
    get:
      tags:
        - 后台-API Key
      summary: 查询当前用户的 API Key 列表
      security:
        - BloggerAuth: []
      responses:
        '200':
          description: API Key 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - 后台-API Key
      summary: 创建 API Key
      description: 创建成功返回 201。密钥原文 `value` 只在创建响应中返回一次。
      security:
        - BloggerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
