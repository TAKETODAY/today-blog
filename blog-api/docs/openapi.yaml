          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - 后台-用户
      summary: 删除用户
      security:
        - BloggerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------- 统计 ------------------------------
  /api/statistics/dashboard:
    get:
      tags:
        - 统计
      summary: 获取仪表盘统计数据
      security:
        - BloggerAuth: []
      responses:
        '200':
          description: 仪表盘统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/statistics/{type}:
    get:
      tags:
        - 统计
      summary: 按维度统计页面访问数据
      description: |
        按指定维度分析页面访问记录，返回维度值 -> 计数的映射。
        例如 `GET /api/statistics/os` 返回 `{ "Windows": 123, "macOS": 45 }`。

        注意 `/api/statistics/pv` 为更具体的日期区间统计接口（见下一路径），
        `{type}` 实际可取 `os`、`url`、`user`、`device`、`referer`、`browser`、`user_agent`。
      parameters:
        - name: type
          in: path
          required: true
          description: 统计维度
          schema:
            $ref: '#/components/schemas/StatisticsField'
      security:
        - BloggerAuth: []
      responses:
        '200':
          description: 维度 -> 计数映射
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/statistics/pv:
    get:
      tags:
        - 统计
      summary: 按日期区间统计页面访问
      description: 按天统计指定日期区间内的 IP、UV、PV，返回日期 -> 统计的映射。
      parameters:
        - name: from
          in: query
          required: false
          description: 起始日期，格式 `yyyy-MM-dd`
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 结束日期，格式 `yyyy-MM-dd`
          schema:
            type: string
            format: date
      security:
        - BloggerAuth: []
      responses:
        '200':
          description: 日期 -> 页面统计映射
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/PageViewStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    AuthenticationInfo:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        登录会话标识（Session Id）。登录成功后由服务端在 `SESSION` Cookie 中下发，
        浏览器会自动携带，无需手动添加。
    BloggerAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        博主权限认证。两种方式均可：
        - 请求头 `X-API-Key: <api-key>`；
        - 请求头 `Authorization: <api-key>`（或依赖已登录博主的 `SESSION` Cookie）。

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 当前页码（从 1 开始）
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登录或登录已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无访问权限（非博主）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ------------------------------------------------------------------
    # 通用
    # ------------------------------------------------------------------
    Error:
      type: object
      description: 错误信息
      required:
        - message
      properties:
        message:
          type: string
          nullable: true
          description: 错误描述

    Pagination:
      type: object
      description: 分页结构基类
      required:
        - pages
        - total
        - size
        - current
        - data
      properties:
        pages:
          type: integer
          description: 总页数
        total:
          type: integer
          description: 记录总数
        size:
          type: integer
          description: 每页条数
        current:
          type: integer
          description: 当前页码
        data:
          type: array
          items: {}

    # ------------------------------------------------------------------
    # 文章
    # ------------------------------------------------------------------
    PostStatus:
      type: string
      description: 文章状态
      enum:
        - PUBLISHED
        - DRAFT
        - RECYCLE

    Article:
      type: object
      description: 文章
      allOf:
        - $ref: '#/components/schemas/BasicModel'
      properties:
        cover:
          type: string
          nullable: true
          description: 封面图
        title:
          type: string
          description: 标题
        pv:
          type: integer
          description: 浏览量
        status:
          $ref: '#/components/schemas/PostStatus'
        summary:
          type: string
          description: 摘要
        content:
          type: string
          description: HTML 内容
        markdown:
          type: string
          nullable: true
          description: Markdown 原文
        password:
          type: string
          nullable: true
          description: 访问密码（仅在后台列表中可见）
        uri:
          type: string
          description: 文章访问地址
        category:
          type: string
          description: 文章分类名
        copyright:
          type: string
          description: 版权声明
        labels:
          type: array
          nullable: true
          description: 文章标签
          items:
            $ref: '#/components/schemas/Label'

    ArticleItem:
      type: object
      description: 文章列表项（公开列表使用，不含正文）
      required:
        - id
        - pv
      properties:
        id:
          type: integer
          format: int64
        pv:
          type: integer
        uri:
          type: string
        title:
          type: string
        cover:
          type: string
          nullable: true
        summary:
          type: string
        tags:
          type: array
          description: 标签名列表
          items:
            type: string
        createAt:
          type: string
          format: date-time
          nullable: true

    ArticleForm:
      type: object
      description: 创建 / 更新文章的请求体
      required:
        - title
        - uri
      properties:
        createAt:
          type: string
          nullable: true
          description: 创建时间（格式化字符串）
        category:
          type: string
        copyright:
          type: string
        labels:
          type: array
          description: 标签名集合
          items:
            type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        summary:
          type: string
        content:
          type: string
          description: HTML 内容
        markdown:
          type: string
        uri:
          type: string
        cover:
          type: string
          nullable: true
        password:
          type: string
          nullable: true

    # ------------------------------------------------------------------
    # 用户 / 认证
    # ------------------------------------------------------------------
    UserStatus:
      type: string
      description: 用户状态
      enum:
        - NORMAL
        - INACTIVE
        - LOCKED
        - RECYCLE

    User:
      type: object
      description: 用户
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/UserStatus'
        name:
          type: string
        email:
          type: string
          format: email
        site:
          type: string
          nullable: true
        type:
          type: string
          description: 用户类型
        avatar:
          type: string
          nullable: true
        introduce:
          type: string
          nullable: true
        background:
          type: string
          nullable: true
        notification:
          type: boolean
          description: 是否接收邮件通知
        blogger:
          type: boolean
          description: 是否为博主

    UserFrom:
      type: object
      description: 登录请求体
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InfoForm:
      type: object
      description: 更新当前用户信息的请求体
      required:
        - name
      properties:
        name:
          type: string
        site:
          type: string
          nullable: true
        introduce:
          type: string
          description: 自我简介（最多 256 字符）
        notification:
          type: boolean
          default: false

    ChangePasswordForm:
      type: object
      description: 修改密码请求体
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          description: 新密码（6 - 48 个字符）
          minLength: 6
          maxLength: 48
        confirmNewPassword:
          type: string
          description: 确认新密码

    UserEmailForm:
      type: object
      description: 修改邮箱请求体
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserSettingsForm:
      type: object
      description: 后台更新用户资料请求体
      required:
        - name
      properties:
        name:
          type: string
        site:
          type: string
        introduce:
          type: string
          default: 暂无介绍
        notification:
          type: boolean
          default: false

    # ------------------------------------------------------------------
    # 分类 / 标签 / 评论
    # ------------------------------------------------------------------
    Category:
      type: object
      description: 文章分类
      properties:
        name:
          type: string
          description: 分类名（同时作为唯一的 ID）
        order:
          type: integer
          description: 排序值（默认 128）
        articleCount:
          type: integer
          nullable: true
          description: 该分类下的文章数
        description:
          type: string
          nullable: true

    Label:
      type: object
      description: 文章标签
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    CommentStatus:
      type: string
      description: 评论状态
      enum:
        - CHECKED
        - CHECKING
        - RECYCLE

    CommentFrom:
      type: object
      description: 发表评论请求体
      required:
        - content
        - articleId
        - commenter
      properties:
        content:
          type: string
          description: 评论内容
        articleId:
          type: integer
          format: int64
          description: 被评论的文章 ID
        commentId:
          type: integer
          format: int64
          nullable: true
          description: 父评论 ID（回复某条评论时填写）
        email:
          type: string
          format: email
          description: 评论者邮箱
        commenter:
          type: string
          description: 评论者昵称
        commenterSite:
          type: string
          nullable: true
          description: 评论者网站地址

    Comment:
      type: object
      description: 评论
      allOf:
        - $ref: '#/components/schemas/BasicModel'
      properties:
        content:
          type: string
        status:
          $ref: '#/components/schemas/CommentStatus'
        articleId:
          type: integer
          format: int64
        articleTitle:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        commenter:
          type: string
          nullable: true
        commenterSite:
          type: string
          nullable: true
        parentId:
          type: integer
          format: int64
          nullable: true
        replies:
          type: array
          description: 子评论（后台列表树）
          items:
            $ref: '#/components/schemas/Comment'

    CommentItem:
      type: object
      description: 评论列表项（公开文章评论使用）
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        email:
          type: string
          nullable: true
        commenter:
          type: string
        commenterSite:
          type: string
          nullable: true
        commenterDesc:
          type: string
          nullable: true
          description: 评论者简介（来自用户资料）
        user:
          $ref: '#/components/schemas/User'
          nullable: true
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        createAt:
          type: string
          format: date-time
          nullable: true
        updateAt:
          type: string
          format: date-time
          nullable: true

    # ------------------------------------------------------------------
    # API Key
    # ------------------------------------------------------------------
    ApiKey:
      type: object
      description: API Key 信息
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
          description: 所属用户 ID
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    CreateApiKeyRequest:
      type: object
      description: 创建 API Key 请求体
      required:
        - name
      properties:
        name:
          type: string

    CreatedApiKey:
      type: object
      description: 创建 API Key 的响应。密钥原文只在本响应中返回一次
      required:
        - apiKey
        - value
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        value:
          type: string
          description: 明文密钥（请立即保存）

    # ------------------------------------------------------------------
    # 附件
    # ------------------------------------------------------------------
    AttachmentType:
      type: string
      description: 附件类型
      enum:
        - IMAGE
        - AUDIO
        - VIDEO
        - TEXT
        - OTHER

    Attachment:
      type: object
      description: 附件
      allOf:
        - $ref: '#/components/schemas/BasicModel'
      properties:
        name:
          type: string
          description: 附件名
        uri:
          type: string
          description: 对外访问地址（CDN 或本地）
        location:
          type: string
          nullable: true
          description: 附件本地存储路径
        fileType:
          $ref: '#/components/schemas/AttachmentType'
        size:
          type: integer
          format: int64
          nullable: true
        sync:
          type: boolean
          nullable: true
          description: 是否已同步到 OSS

    UploadReturnValue:
      type: object
      description: 文件上传响应
      required:
        - uri
        - cdnURL
      properties:
        uri:
          type: string
          description: 附件本地/相对 URI
        cdnURL:
          type: string
          nullable: true
          description: 附件 CDN 地址（可能为空）

    # ------------------------------------------------------------------
    # 日志 / 邮件 / 选项 / 页面访问
    # ------------------------------------------------------------------
    LoggingType:
      type: string
      description: 操作日志类型
      enum:
        - LOGIN
        - LOGOUT
        - SYSTEM

    OperationLogging:
      type: object
      description: 操作日志
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
          description: 产生日志的 IP
        ipCountry:
          type: string
          nullable: true
        ipProvince:
          type: string
          nullable: true
        ipCity:
          type: string
          nullable: true
        ipArea:
          type: string
          nullable: true
        ipIsp:
          type: string
          nullable: true
        user:
          type: string
          nullable: true
          description: 操作者
        type:
          $ref: '#/components/schemas/LoggingType'
        invokeAt:
          type: string
          format: date-time
          nullable: true
        createAt:
          type: string
          format: date-time
          nullable: true

    Mail:
      type: object
      description: 邮件发送记录
      allOf:
        - $ref: '#/components/schemas/BasicModel'
      properties:
        to:
          type: string
          description: 收件人（数据库列 `recipient`）
        subject:
          type: string
        content:
          type: string
        sentAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - SENDING
            - SENT
            - FAILED
        attempts:
          type: integer
          nullable: true
          description: 发送尝试次数
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        attachment:
          type: string
          nullable: true

    OptionValueType:
      type: string
      description: 选项值类型
      enum:
        - bool
        - string
        - number

    Option:
      type: object
      description: 系统选项（配置项）
      properties:
        name:
          type: string
          description: 选项名（同时作为唯一的 ID）
        value:
          type: string
          nullable: true
        open:
          type: boolean
          nullable: true
          description: 是否对公开接口开放
        description:
          type: string
          nullable: true
        updateAt:
          type: string
          format: date-time
          nullable: true
        valueType:
          $ref: '#/components/schemas/OptionValueType'
          nullable: true

    PageView:
      type: object
      description: 页面访问记录
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        user:
          type: string
          nullable: true
          description: 登录用户标识（`名字:邮箱`，未登录为空）
        os:
          type: string
          nullable: true
        device:
          type: string
          nullable: true
        referer:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        browser:
          type: string
          nullable: true
        browserVersion:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        ipCountry:
          type: string
          nullable: true
        ipProvince:
          type: string
          nullable: true
        ipCity:
          type: string
          nullable: true
        ipArea:
          type: string
          nullable: true
        ipIsp:
          type: string
          nullable: true
        createAt:
          type: string
          format: date-time
          nullable: true

    PageViewStatistics:
      type: object
      description: 单日页面访问统计
      required:
        - ip
        - uv
        - pv
      properties:
        ip:
          type: integer
          description: 独立 IP 数
        uv:
          type: integer
          description: 独立访客数
        pv:
          type: integer
          description: 浏览量

    # ------------------------------------------------------------------
    # 统计
    # ------------------------------------------------------------------
    StatisticsField:
      type: string
      description: 页面访问统计维度
      enum:
        - os
        - url
        - user
        - device
        - referer
        - browser
        - user_agent

    DashboardStatistics:
      type: object
      description: 仪表盘统计
      required:
        - lastStartup
        - articleCount
        - commentCount
        - attachmentCount
      properties:
        lastStartup:
          type: integer
          format: int64
          description: 最近一次启动时间（毫秒时间戳）
        articleCount:
          type: integer
        commentCount:
          type: integer
        attachmentCount:
          type: integer
        logs:
          type: array
          description: 最近的操作日志
          items:
            $ref: '#/components/schemas/OperationLogging'
        articles:
          type: array
          description: 最近的文章
          items:
            $ref: '#/components/schemas/Article'
        comments:
          type: array
          description: 最近的评论
          items:
            $ref: '#/components/schemas/Comment'

    # ------------------------------------------------------------------
    # 基础模型（id / createAt / updateAt）
    # ------------------------------------------------------------------
    BasicModel:
      type: object
      description: 公共基础字段
      properties:
        id:
          type: integer
          format: int64
          description: 主键 ID
        createAt:
          type: string
          format: date-time
          nullable: true
        updateAt:
          type: string
          format: date-time
          nullable: true

    # ------------------------------------------------------------------
    # 排序
    # ------------------------------------------------------------------
    OrderBy:
      type: string
      description: 排序方向
      enum:
        - descend
        - ascend

    # ------------------------------------------------------------------
    # 分页数据 wrapper
    # ------------------------------------------------------------------
    ArticleItemPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ArticleItem'
    ArticlePage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Article'
    CommentPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
    AttachmentPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
    OperationLoggingPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/OperationLogging'
    MailPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Mail'
